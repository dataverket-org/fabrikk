# fabrikk monorepo. Protected path: verification and release run these tasks.
#
# A task is one line: it calls the script in scripts/ that does the work, so `task check` and scripts/check are the
# same thing. A NAME=value argument is a template variable to task, not an environment variable, so each task
# passes the ones its script reads through `env`.
#
# Dev-environment tasks need the fragments under deploy/dev/ and the products' suites, which arrive with the first
# product; the stack naming they enforce is decided in scripts/functions/stack.sh (dev-environment skill, "Stacks").
version: '3'

silent: true

tasks:
  default:
    cmds:
      - task --list

  tools:
    desc: Install pinned task, ko, cosign, kustomize, crane, golangci-lint and flux into _bin
    cmds:
      - scripts/tools

  dev.up:
    desc: '[PROFILE=objekt|maskin] Start the shared session stack for this workbench and wait until healthy'
    env:
      PROFILE: '{{.PROFILE}}'
    cmds:
      - scripts/dev-up

  dev.down:
    desc: Stop the shared session stack, keep volumes
    cmds:
      - scripts/dev-down

  dev.reset:
    desc: "[WIPE=1] Run every fragment's reset script; WIPE=1 also removes volumes"
    env:
      WIPE: '{{.WIPE}}'
    cmds:
      - scripts/dev-reset

  check:
    desc: 'Tier 0: SPDX headers, gofmt, go vet, golangci-lint, go test over every module in go.work'
    cmds:
      - scripts/check

  verify:
    desc: 'Tier 2: ko images for this commit, private verify stack, contract and black-box suites, teardown'
    cmds:
      - scripts/verify

  release:
    desc: 'PRODUCT=<p>: build images, join with every miljo overlay for <p>, push, sign, and tag :candidate (CI only)'
    env:
      PRODUCT: '{{.PRODUCT}}'
      MILJO: '{{.MILJO}}'
      REGISTRY: '{{.REGISTRY}}'
      COSIGN_KEY: '{{.COSIGN_KEY}}'
      SOURCE_URL: '{{.SOURCE_URL}}'
    cmds:
      - scripts/release
