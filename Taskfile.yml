# fabrikk monorepo. Protected path: verification and release run these tasks.
#
# A task is one line: it calls the script in scripts/ that does the work, so `task check` and scripts/check are the
# same thing. A NAME=value argument is a template variable to task, not an environment variable, so each task
# passes the ones its script reads through `env`.
#
# The stacks `task verify` and `task stack` make are named in scripts/functions/stack.sh (dev-environment skill,
# "Stacks").
version: '3'

silent: true

tasks:
  default:
    cmds:
      - task --list

  tools:
    desc: Install pinned task, ko, cosign, kustomize, crane, golangci-lint and flux into _bin
    cmds:
      - scripts/tools

  check:
    desc: 'SPDX headers, gofmt, go vet, golangci-lint and the unit tests of every module in go.work'
    cmds:
      - scripts/check

  verify:
    desc: 'System tests: ko images for this commit, private verify stack, the tests from outside, teardown'
    cmds:
      - scripts/verify

  stack:
    desc: "[PROFILE=verify|objekt] [-- command] A shell in a private stack of the system tests' dependencies"
    interactive: true
    env:
      PROFILE: '{{.PROFILE}}'
    cmds:
      - scripts/stack {{.CLI_ARGS}}

  fabrikk.test:
    desc: 'fabrikk itself, not what it builds: the extension tests, the factory definitions and scenarios, the workflows'
    cmds:
      - scripts/fabrikk-test

  release:
    desc: 'PRODUCT=<p>: build images, join with every miljo overlay for <p>, push, sign, and tag :candidate (CI only)'
    env:
      PRODUCT: '{{.PRODUCT}}'
      MILJO: '{{.MILJO}}'
      REGISTRY: '{{.REGISTRY}}'
      COSIGN_KEY: '{{.COSIGN_KEY}}'
      SOURCE_URL: '{{.SOURCE_URL}}'
    cmds:
      - scripts/release
