# golangci-lint for every Go module in the monorepo, run by scripts/check (task check, tier 0). Protected path:
# verification runs it from the branch under review, and a weakened lint would still give a green attestation.
#
# Only what a reviewer should not have to find is here (architecture skill, "Checked, not reviewed"). The first
# product adds the import rules: the dependency direction, and which package may import the transport and the
# database drivers.
version: "2"

linters:
  default: none
  enable:
    - gochecksumtype   # a switch over a sealed interface marked //sumtype:decl covers every case
    - exhaustive       # a switch or a map literal over a constant enum covers every constant
  settings:
    gochecksumtype:
      default-signifies-exhaustive: false
    exhaustive:
      check: [switch, mapliteral]
      default-signifies-exhaustive: false
