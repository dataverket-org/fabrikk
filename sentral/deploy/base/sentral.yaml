# Sentral, as it ships. Readiness asks /readyz and liveness asks only /healthz, and there is no startupProbe: a probe
# that restarts on "not ready" would have a cluster kill Sentral whenever the server is away, when it should wait.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentral
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentral
  template:
    metadata:
      labels:
        app: sentral
    spec:
      containers:
        - name: sentral
          image: ko://git.dataverket.org/dataverket/fabrikk/sentral/cmd/sentral
          env:
            # The tenant this instance is pinned to. The value is the stacks' own and names no organisation that
            # exists.
            - name: TENANT
              value: 88d81e5e-b671-4963-97bc-a3da3ecdbebd
            - name: NATS_URL
              value: nats://nats:4222
          ports:
            - containerPort: 8080
          readinessProbe:
            exec:
              command: ["/ko-app/sentral", "probe"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/ko-app/sentral", "probe", "/healthz"]
            periodSeconds: 5
